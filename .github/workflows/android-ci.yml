name: Android Automation CI (Emulator)

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:
    inputs:
      env:
        description: 'Target Environment'
        required: true
        default: 'qa'
        type: choice
        options:
          - qa
          - prod
      suite:
        description: 'TestNG Suite XML file'
        required: true
        default: 'testng-qa.xml'
        type: string

jobs:
  android-test:
    runs-on: macos-13
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Appium & UiAutomator2 Driver
        run: |
          npm install -g appium
          appium driver install uiautomator2
          appium -v

      - name: Start Appium Server in Background
        run: |
          nohup appium --log appium.log --port 4723 > /dev/null 2>&1 &
          sleep 5
          curl --retry 5 --retry-delay 2 --retry-connrefused http://127.0.0.1:4723/status || echo "Appium warming up..."

      - name: Ensure APK is Available
        run: |
          mkdir -p apps
          if ! ls apps/*.apk 1> /dev/null 2>&1; then
            echo "No APK in repo, downloading from Google Drive..."
            python3 -m pip install --quiet gdown
            gdown 1dDV9FrZieZXvqcirdp5Brm_pPrYzu1Mf -O apps/seedling.apk
          else
            echo "Found APK in apps/ folder:"
            ls -la apps/*.apk
          fi

      - name: Run Tests on Android Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          script: |
            echo "Android Emulator is ready! Running tests..."
            mvn test \
              -Denv=${{ github.event.inputs.env || 'qa' }} \
              -Dplatform=android \
              -Dexecution=ci \
              -DsuiteXmlFile=${{ github.event.inputs.suite || 'testng-qa.xml' }}

      - name: Upload Test Report & Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: |
            target/index.html
            target/surefire-reports/
            logs/
            appium.log
          retention-days: 14
