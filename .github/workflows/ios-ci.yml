name: iOS Automation CI (Simulator)

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:
    inputs:
      env:
        description: 'Target Environment'
        required: true
        default: 'qa'
        type: choice
        options:
          - qa
          - prod
      suite:
        description: 'TestNG Suite XML file'
        required: true
        default: 'testng-qa.xml'
        type: string
      device:
        description: 'iOS Simulator Device'
        required: true
        default: 'iPhone 15'
        type: string

jobs:
  ios-test:
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Appium & XCUITest Driver
        run: |
          npm install -g appium
          appium driver install xcuitest
          appium -v

      - name: Boot iOS Simulator
        run: |
          DEVICE_NAME="${{ github.event.inputs.device || 'iPhone 15' }}"
          echo "Finding simulator for: $DEVICE_NAME..."
          UDID=$(xcrun simctl list devices available | grep "$DEVICE_NAME" | head -1 | grep -oE "\([0-9A-F-]+\)" | tr -d "()")
          if [ -z "$UDID" ]; then
            echo "Simulator $DEVICE_NAME not found by exact match, picking first available iPhone..."
            UDID=$(xcrun simctl list devices available | grep "iPhone" | head -1 | grep -oE "\([0-9A-F-]+\)" | tr -d "()")
          fi
          echo "Booting Simulator UDID: $UDID"
          xcrun simctl boot $UDID || true
          xcrun simctl bootstatus $UDID -b

      - name: Start Appium Server in Background
        run: |
          nohup appium --log appium.log --port 4723 > /dev/null 2>&1 &
          sleep 5
          curl --retry 5 --retry-delay 2 --retry-connrefused http://127.0.0.1:4723/status || echo "Appium warming up..."

      - name: Unpack iOS Simulator App if zipped
        run: |
          for zipfile in apps/*.zip; do
            if [ -f "$zipfile" ]; then
              echo "Unpacking $zipfile into apps/..."
              unzip -o "$zipfile" -d apps/
            fi
          done

      - name: Run Tests on iOS Simulator
        run: |
          mvn test \
            -Denv=${{ github.event.inputs.env || 'qa' }} \
            -Dplatform=ios \
            -Dexecution=ci \
            -DsuiteXmlFile=${{ github.event.inputs.suite || 'testng-qa.xml' }}

      - name: Upload Test Report & Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-reports
          path: |
            target/index.html
            target/surefire-reports/
            logs/
            appium.log
          retention-days: 14
