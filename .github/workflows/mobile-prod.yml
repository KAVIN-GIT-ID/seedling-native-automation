name: Native Mobile Tests - PROD

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Mobile Platform'
        type: choice
        required: true
        options:
          - android
          - ios
        default: 'android'
      component:
        description: 'Test file to run on PROD'
        type: choice
        required: true
        options:
          - all (runs all read-only tests)
          - com.company.automation.tests.LoginTests
        default: 'all (runs all read-only tests)'

jobs:
  test:
    timeout-minutes: 60
    runs-on: ${{ github.event.inputs.platform == 'ios' && 'macos-14' || 'ubuntu-latest' }}
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Enable KVM Hardware Acceleration
        if: ${{ github.event.inputs.platform == 'android' }}
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Test Credentials
        run: |
          mkdir -p config
          echo "qa.username=${{ secrets.QA_USERNAME || 'kavinap@uit.ac.in' }}" > config/credentials.properties
          echo "qa.password=${{ secrets.QA_PASSWORD || 'Uit@1234567890' }}" >> config/credentials.properties
          echo "prod.username=${{ secrets.PROD_USERNAME || '' }}" >> config/credentials.properties
          echo "prod.password=${{ secrets.PROD_PASSWORD || '' }}" >> config/credentials.properties
          echo "ios.devicePasscode=000000" >> config/credentials.properties


      # Cache Appium and Drivers
      - name: Cache Appium & Drivers
        uses: actions/cache@v4
        id: appium-cache
        with:
          path: |
            ~/.appium
            ~/.npm
          key: ${{ runner.os }}-appium-2.0-v2

      - name: Install Appium
        run: |
          if ! command -v appium &> /dev/null; then
            npm install -g appium
          fi
          appium -v

      # Android Setup
      - name: Setup Android Driver
        if: ${{ github.event.inputs.platform == 'android' }}
        run: |
          appium driver install uiautomator2 || true

      - name: Ensure Android PROD APK Available
        if: ${{ github.event.inputs.platform == 'android' }}
        run: |
          mkdir -p apps/prod
          if ! ls apps/prod/*.apk apps/*.apk 1> /dev/null 2>&1; then
            echo "No PROD APK found in apps/prod/. Place seedling-prod.apk in apps/prod/ or apps/."
          else
            echo "Found PROD APK file in apps folder."
          fi

      # iOS Setup
      - name: Setup iOS Driver & Simulator
        if: ${{ github.event.inputs.platform == 'ios' }}
        run: |
          appium driver install xcuitest || true
          
          # Unpack iOS App if zipped
          for zipfile in apps/prod/*.zip apps/*.zip; do
            if [ -f "$zipfile" ]; then
              echo "Unpacking $zipfile into apps/prod/..."
              mkdir -p apps/prod
              unzip -o "$zipfile" -d apps/prod/
            fi
          done


          # Boot iPhone 15 Simulator
          UDID=$(xcrun simctl list devices available | grep "iPhone 15" | head -1 | grep -oE "\([0-9A-F-]+\)" | tr -d "()")
          if [ -z "$UDID" ]; then
            UDID=$(xcrun simctl list devices available | grep "iPhone" | head -1 | grep -oE "\([0-9A-F-]+\)" | tr -d "()")
          fi
          echo "Booting iOS Simulator UDID: $UDID"
          xcrun simctl boot $UDID || true
          xcrun simctl bootstatus $UDID -b || true
          echo "IOS_UDID=$UDID" >> $GITHUB_ENV

          # Install unzipped .app to iOS simulator
          for appdir in apps/prod/*.app apps/*.app; do
            if [ -d "$appdir" ]; then
              echo "Pre-installing $appdir into simulator $UDID..."
              xcrun simctl install $UDID "$appdir" || true
            fi
          done

      - name: Start Appium Server in Background
        run: |
          nohup appium --log appium.log --port 4723 > /dev/null 2>&1 &
          sleep 5
          curl --retry 5 --retry-delay 2 --retry-connrefused http://127.0.0.1:4723/status || echo "Appium warming up..."

      - name: Determine Test Command
        id: set-command
        run: |
          PLATFORM="${{ github.event.inputs.platform }}"
          COMP="${{ github.event.inputs.component }}"

          if [[ "$COMP" == *"all"* ]]; then
            CMD="mvn test -Denv=prod -Dplatform=$PLATFORM -Dexecution=ci -DsuiteXmlFile=testng-prod.xml"
          else
            CMD="mvn test -Denv=prod -Dplatform=$PLATFORM -Dexecution=ci -Dtest=$COMP"
          fi

          echo "TEST_COMMAND=$CMD" >> $GITHUB_ENV
          echo "Selected Command: $CMD"

      # Execute Tests (Android uses reactivecircus emulator, iOS runs directly on simulator)
      - name: Run Android Tests on Emulator
        if: ${{ github.event.inputs.platform == 'android' }}
        uses: reactivecircus/android-emulator-runner@v2
        env:
          QA_USERNAME: ${{ secrets.QA_USERNAME }}
          QA_PASSWORD: ${{ secrets.QA_PASSWORD }}
          PROD_USERNAME: ${{ secrets.PROD_USERNAME }}
          PROD_PASSWORD: ${{ secrets.PROD_PASSWORD }}
        with:
          api-level: 31
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: ${{ env.TEST_COMMAND }}


      - name: Run iOS Tests on Simulator
        if: ${{ github.event.inputs.platform == 'ios' }}
        env:
          QA_USERNAME: ${{ secrets.QA_USERNAME }}
          QA_PASSWORD: ${{ secrets.QA_PASSWORD }}
          PROD_USERNAME: ${{ secrets.PROD_USERNAME }}
          PROD_PASSWORD: ${{ secrets.PROD_PASSWORD }}
        run: |
          # ── Clean old logs & reports ──────────────────────────────────────
          rm -rf logs target
          mkdir -p logs

          # ── Start Appium in background ────────────────────────────────────
          nohup appium --log appium.log --port 4723 > /dev/null 2>&1 &
          echo "Waiting 15s for Appium server to be ready on port 4723..."
          sleep 15
          curl --retry 5 --retry-delay 2 --retry-connrefused http://127.0.0.1:4723/status || echo "Appium warming up..."

          # ── Run Maven tests ───────────────────────────────────────────────
          ${{ env.TEST_COMMAND }}


      - name: Upload Test Report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: mobile-report-prod-${{ github.event.inputs.platform }}
          path: |
            target/index.html
            target/surefire-reports/
            logs/
            appium.log
          retention-days: 30

      - name: Deploy Report to Surge
        if: ${{ !cancelled() }}
        env:
          SURGE_LOGIN: ${{ secrets.SURGE_LOGIN || 'kavinap@uit.ac.in' }}
          SURGE_TOKEN: ${{ secrets.SURGE_TOKEN || '8d9007929b91f647f65f8f3667da6ae0' }}
        run: |
          if [ -f target/index.html ]; then
            npx surge ./target ${{ github.run_id }}-seedling-mobile-prod.surge.sh
          fi

      - name: Prepare HTML Email Body
        if: ${{ !cancelled() }}
        env:
          ENVIRONMENT: PROD
          PLATFORM: ${{ github.event.inputs.platform }}
          COMPONENT: ${{ github.event.inputs.component }}
          REPORT_URL: "https://${{ github.run_id }}-seedling-mobile-prod.surge.sh"
          RUN_URL: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          JOB_STATUS: ${{ job.status }}
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          node utils/generate-email-html.js

      - name: Send Email Report
        if: ${{ !cancelled() }}
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USERNAME || 'apkavin483@gmail.com' }}
          password: ${{ secrets.EMAIL_PASSWORD || 'cjhhgojueofrqntp' }}
          subject: "Mobile PROD [${{ github.event.inputs.platform }}] - ${{ job.status == 'success' && '✅ PASSED' || '❌ FAILED' }}"
          to: ${{ secrets.TL_EMAIL || 'kavinap@uit.ac.in' }}
          from: Seedling Automation <${{ secrets.EMAIL_USERNAME || 'apkavin483@gmail.com' }}>
          html_body: file://email-body.html
