name: Native Mobile Tests - QA

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Mobile Platform'
        type: choice
        required: true
        options:
          - android
          - ios
        default: 'android'
      component:
        description: 'Test file to run on QA'
        type: choice
        required: true
        options:
          - all (runs all QA tests)
          - com.company.automation.tests.LoginTests
          - com.company.automation.tests.SeedlingCreationTests
        default: 'all (runs all QA tests)'
      force_fresh_app:
        description: 'Force re-download fresh APK from Google Drive (bypasses cache)'
        type: boolean
        required: false
        default: false

jobs:
  test:
    timeout-minutes: 60
    runs-on: ${{ github.event.inputs.platform == 'ios' && 'macos-14' || 'ubuntu-latest' }}
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Enable KVM Hardware Acceleration
        if: ${{ github.event.inputs.platform == 'android' }}
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Test Credentials
        run: |
          mkdir -p config
          echo "qa.username=${{ secrets.QA_USERNAME || 'kavinap@uit.ac.in' }}" > config/credentials.properties
          echo "qa.password=${{ secrets.QA_PASSWORD || 'Uit@1234567890' }}" >> config/credentials.properties
          echo "prod.username=${{ secrets.PROD_USERNAME || '' }}" >> config/credentials.properties
          echo "prod.password=${{ secrets.PROD_PASSWORD || '' }}" >> config/credentials.properties
          echo "ios.devicePasscode=000000" >> config/credentials.properties

      # Cache Appium and Drivers
      - name: Cache Appium & Drivers
        uses: actions/cache@v4
        id: appium-cache
        with:
          path: |
            ~/.appium
            ~/.npm
          key: ${{ runner.os }}-appium-2.0-v2

      - name: Install Appium
        run: |
          if ! command -v appium &> /dev/null; then
            npm install -g appium
          fi
          appium -v

      # Cache Android QA APK (Smart cache keyed on qa.properties)
      - name: Cache Android QA APK
        if: ${{ github.event.inputs.platform == 'android' && github.event.inputs.force_fresh_app != 'true' }}
        uses: actions/cache@v4
        id: apk-cache
        with:
          path: apps/qa/
          key: android-qa-apk-${{ hashFiles('config/qa.properties') }}

      # Android Setup
      - name: Setup Android Driver & APK
        if: ${{ github.event.inputs.platform == 'android' }}
        run: |
          if ! appium driver list --installed | grep -q uiautomator2; then
            appium driver install uiautomator2
          fi
          mkdir -p apps/qa
          if [ "${{ github.event.inputs.force_fresh_app }}" = "true" ] || ! ls apps/qa/*.apk apps/*.apk 1> /dev/null 2>&1; then
            echo "Downloading QA APK from Google Drive..."
            python3 -m pip install --break-system-packages --quiet gdown
            python3 -m gdown 1dDV9FrZieZXvqcirdp5Brm_pPrYzu1Mf -O apps/qa/seedling-dev.apk
          else
            echo "Found existing/cached APK file in apps folder."
          fi

      # iOS Setup
      - name: Setup iOS Driver & Simulator
        if: ${{ github.event.inputs.platform == 'ios' }}
        run: |
          if ! appium driver list --installed | grep -q xcuitest; then
            appium driver install xcuitest
          fi
          
          # Unpack iOS App if zipped
          for zipfile in apps/qa/*.zip apps/*.zip; do
            if [ -f "$zipfile" ]; then
              echo "Unpacking $zipfile into apps/qa/..."
              mkdir -p apps/qa
              unzip -o "$zipfile" -d apps/qa/
            fi
          done


          # Boot iPhone 15 Simulator
          UDID=$(xcrun simctl list devices available | grep "iPhone 15" | head -1 | grep -oE "\([0-9A-F-]+\)" | tr -d "()")
          if [ -z "$UDID" ]; then
            UDID=$(xcrun simctl list devices available | grep "iPhone" | head -1 | grep -oE "\([0-9A-F-]+\)" | tr -d "()")
          fi
          echo "Booting iOS Simulator UDID: $UDID"
          xcrun simctl boot $UDID || true
          xcrun simctl bootstatus $UDID -b || true

      - name: Start Appium Server in Background
        run: |
          nohup appium --log appium.log --port 4723 > /dev/null 2>&1 &
          sleep 5
          curl --retry 5 --retry-delay 2 --retry-connrefused http://127.0.0.1:4723/status || echo "Appium warming up..."

      - name: Determine Test Command
        id: set-command
        run: |
          PLATFORM="${{ github.event.inputs.platform }}"
          COMP="${{ github.event.inputs.component }}"

          if [[ "$COMP" == *"all"* ]]; then
            CMD="mvn test -Denv=qa -Dplatform=$PLATFORM -Dexecution=ci -DsuiteXmlFile=testng-qa.xml"
          else
            CMD="mvn test -Denv=qa -Dplatform=$PLATFORM -Dexecution=ci -Dtest=$COMP"
          fi

          echo "TEST_COMMAND=$CMD" >> $GITHUB_ENV
          echo "Selected Command: $CMD"

      # Execute Tests (Android uses reactivecircus emulator, iOS runs directly on simulator)
      - name: Run Android Tests on Emulator
        if: ${{ github.event.inputs.platform == 'android' }}
        uses: reactivecircus/android-emulator-runner@v2
        env:
          QA_USERNAME: ${{ secrets.QA_USERNAME }}
          QA_PASSWORD: ${{ secrets.QA_PASSWORD }}
          PROD_USERNAME: ${{ secrets.PROD_USERNAME }}
          PROD_PASSWORD: ${{ secrets.PROD_PASSWORD }}
        with:
          api-level: 31
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: ${{ env.TEST_COMMAND }}


      - name: Run iOS Tests on Simulator
        if: ${{ github.event.inputs.platform == 'ios' }}
        env:
          QA_USERNAME: ${{ secrets.QA_USERNAME }}
          QA_PASSWORD: ${{ secrets.QA_PASSWORD }}
          PROD_USERNAME: ${{ secrets.PROD_USERNAME }}
          PROD_PASSWORD: ${{ secrets.PROD_PASSWORD }}
        run: ${{ env.TEST_COMMAND }}


      - name: Upload Test Report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: mobile-report-qa-${{ github.event.inputs.platform }}
          path: |
            target/index.html
            target/surefire-reports/
            logs/
            appium.log
          retention-days: 30

      - name: Deploy Report to Surge
        if: ${{ !cancelled() && env.SURGE_LOGIN != '' }}
        env:
          SURGE_LOGIN: ${{ secrets.SURGE_LOGIN }}
          SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}
        run: |
          if [ -f target/index.html ]; then
            npx surge ./target ${{ github.run_id }}-seedling-mobile-qa.surge.sh
          fi

      - name: Prepare Email Body
        if: ${{ !cancelled() }}
        run: |
          REPORT_URL="https://${{ github.run_id }}-seedling-mobile-qa.surge.sh"

          echo "Mobile App Automation test run finished." > email-body.txt
          echo "Status: ${{ job.status }}" >> email-body.txt
          echo "Environment: QA" >> email-body.txt
          echo "Platform: ${{ github.event.inputs.platform }}" >> email-body.txt
          echo "Component: ${{ github.event.inputs.component }}" >> email-body.txt
          echo "Branch: ${{ github.ref_name }}" >> email-body.txt
          echo "Run link: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> email-body.txt
          echo "" >> email-body.txt

          if [ "${{ job.status }}" != "success" ]; then
            echo "=== TEST FAILURES ===" >> email-body.txt
            if [ -f test-output.log ]; then
              grep -E "FAILURE|ERROR|Exception|AssertionError" test-output.log | head -20 >> email-body.txt || echo "See ExtentReport for failure screenshot." >> email-body.txt
            fi
            echo "=====================" >> email-body.txt
            echo "" >> email-body.txt
          fi

          echo "VIEW INTERACTIVE HTML REPORT HERE (One-Click):" >> email-body.txt
          echo "$REPORT_URL" >> email-body.txt
          echo "" >> email-body.txt

      - name: Send Email Report
        if: ${{ !cancelled() && env.EMAIL_USERNAME != '' }}
        uses: dawidd6/action-send-mail@v3
        env:
          EMAIL_USERNAME: ${{ secrets.EMAIL_USERNAME }}
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "Mobile QA [${{ github.event.inputs.platform }}] Run ${{ job.status }} - ${{ github.event.inputs.component }}"
          to: ${{ secrets.TL_EMAIL }}
          from: Seedling Automation <${{ secrets.EMAIL_USERNAME }}>
          body: file://email-body.txt
