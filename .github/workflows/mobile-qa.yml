name: Native Mobile Tests - QA

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Mobile Platform'
        type: choice
        required: true
        options:
          - android
          - ios
        default: 'android'
      component:
        description: 'Test file to run on QA'
        type: choice
        required: true
        options:
          - all (runs all QA tests)
          - com.company.automation.tests.LoginTests
          - com.company.automation.tests.SeedlingCreationTests
        default: 'all (runs all QA tests)'
      force_fresh_app:
        description: 'Force re-download fresh APK from Google Drive (bypasses cache)'
        type: boolean
        required: false
        default: false

jobs:
  test:
    timeout-minutes: 60
    runs-on: ${{ github.event.inputs.platform == 'ios' && 'macos-14' || 'ubuntu-latest' }}
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Enable KVM Hardware Acceleration
        if: ${{ github.event.inputs.platform == 'android' }}
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Test Credentials
        run: |
          mkdir -p config
          echo "qa.username=${{ secrets.QA_USERNAME || 'kavinap@uit.ac.in' }}" > config/credentials.properties
          echo "qa.password=${{ secrets.QA_PASSWORD || 'Uit@1234567890' }}" >> config/credentials.properties
          echo "prod.username=${{ secrets.PROD_USERNAME || '' }}" >> config/credentials.properties
          echo "prod.password=${{ secrets.PROD_PASSWORD || '' }}" >> config/credentials.properties
          echo "ios.devicePasscode=000000" >> config/credentials.properties

      # Cache Appium and Drivers
      - name: Cache Appium & Drivers
        uses: actions/cache@v4
        id: appium-cache
        with:
          path: |
            ~/.appium
            ~/.npm
          key: ${{ runner.os }}-appium-2.0-v2

      - name: Install Appium
        run: |
          if ! command -v appium &> /dev/null; then
            npm install -g appium
          fi
          appium -v

      # Cache Android QA APK (Smart cache keyed on qa.properties)
      - name: Cache Android QA APK
        if: ${{ github.event.inputs.platform == 'android' && github.event.inputs.force_fresh_app != 'true' }}
        uses: actions/cache@v4
        id: apk-cache
        with:
          path: apps/qa/
          key: android-qa-apk-${{ hashFiles('config/qa.properties') }}

      # Android Setup
      - name: Setup Android Driver & APK
        if: ${{ github.event.inputs.platform == 'android' }}
        run: |
          if ! appium driver list --installed | grep -q uiautomator2; then
            appium driver install uiautomator2
          fi
          mkdir -p apps/qa
          if [ "${{ github.event.inputs.force_fresh_app }}" = "true" ] || ! ls apps/qa/*.apk apps/*.apk 1> /dev/null 2>&1; then
            echo "Downloading QA APK from Google Drive..."
            python3 -m pip install --break-system-packages --quiet gdown
            python3 -m gdown --fuzzy "https://drive.google.com/uc?id=1dDV9FrZieZXvqcirdp5Brm_pPrYzu1Mf" -O apps/qa/seedling-dev.apk || {
              echo "⚠️ Google Drive download failed or rate limited."
              if ls apps/qa/*.apk apps/*.apk 1> /dev/null 2>&1; then
                echo "✅ Using pre-existing/cached APK file in apps folder."
              else
                echo "❌ ERROR: Cannot download APK from Google Drive and no local APK found in apps/qa/."
                echo "Please update Google Drive link sharing permissions to 'Anyone with the link' OR commit your seedling-dev.apk into apps/qa/."
                exit 1
              fi
            }
          else
            echo "Found existing/cached APK file in apps folder."
          fi

      # iOS Setup
      - name: Setup iOS Driver & Simulator
        if: ${{ github.event.inputs.platform == 'ios' }}
        run: |
          if ! appium driver list --installed | grep -q xcuitest; then
            appium driver install xcuitest
          fi
          
          # Unpack iOS App if zipped
          for zipfile in apps/qa/*.zip apps/*.zip; do
            if [ -f "$zipfile" ]; then
              echo "Unpacking $zipfile into apps/qa/..."
              mkdir -p apps/qa
              unzip -o "$zipfile" -d apps/qa/
            fi
          done


          # Boot iPhone 15 Simulator
          UDID=$(xcrun simctl list devices available | grep "iPhone 15" | head -1 | grep -oE "\([0-9A-F-]+\)" | tr -d "()")
          if [ -z "$UDID" ]; then
            UDID=$(xcrun simctl list devices available | grep "iPhone" | head -1 | grep -oE "\([0-9A-F-]+\)" | tr -d "()")
          fi
          echo "Booting iOS Simulator UDID: $UDID"
          xcrun simctl boot $UDID || true
          xcrun simctl bootstatus $UDID -b || true



      - name: Determine Test Command
        id: set-command
        run: |
          PLATFORM="${{ github.event.inputs.platform }}"
          COMP="${{ github.event.inputs.component }}"

          if [[ "$COMP" == *"all"* ]]; then
            CMD="mvn test -Denv=qa -Dplatform=$PLATFORM -Dexecution=ci -DsuiteXmlFile=testng-qa.xml"
          else
            CMD="mvn test -Denv=qa -Dplatform=$PLATFORM -Dexecution=ci -Dtest=$COMP"
          fi

          echo "TEST_COMMAND=$CMD" >> $GITHUB_ENV
          echo "Selected Command: $CMD"

      # Execute Tests (Android uses reactivecircus emulator, iOS runs directly on simulator)
      - name: Run Android Tests on Emulator
        if: ${{ github.event.inputs.platform == 'android' }}
        uses: reactivecircus/android-emulator-runner@v2
        env:
          QA_USERNAME: ${{ secrets.QA_USERNAME }}
          QA_PASSWORD: ${{ secrets.QA_PASSWORD }}
          PROD_USERNAME: ${{ secrets.PROD_USERNAME }}
          PROD_PASSWORD: ${{ secrets.PROD_PASSWORD }}
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: pixel_4
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -memory 4096
          script: |
            # ── Clean old logs & reports to guarantee fresh artifacts ─────────
            rm -rf logs target
            mkdir -p logs

            # ── Step 1: Start Appium in background ────────────────────────────
            nohup appium --log appium.log --port 4723 > /dev/null 2>&1 &
            echo "Waiting 15s for Appium to be ready..."
            sleep 15
            curl --retry 5 --retry-delay 2 --retry-connrefused http://127.0.0.1:4723/status || echo "Appium still warming..."

            # ── Step 2: Wait for emulator to be 100% ready ────────────────────
            echo "Waiting for device to be fully ready..."
            adb wait-for-device
            adb shell 'while [[ -z $(getprop sys.boot_completed) ]]; do sleep 1; done'
            echo "Device boot completed. Waiting 15s more for System UI to settle..."
            sleep 15

            # ── Step 3: Dismiss System UI ANR dialogs + immersive mode tip ──
            echo "Dismissing any ANR/crash dialogs before app install..."
            adb shell input keyevent 4 || true
            sleep 1
            adb shell am broadcast -a android.intent.action.CLOSE_SYSTEM_DIALOGS || true
            sleep 1
            # Disable the "Viewing full screen / GOT IT" immersive mode overlay permanently
            adb shell settings put secure immersive_mode_confirmations confirmed || true
            sleep 1

            # ── Step 4: Pre-install APK ───────────────────────────────────────
            APK_PATH=$(find apps/qa apps -name "*.apk" 2>/dev/null | head -1)
            echo "Installing APK: $APK_PATH"
            adb install -r "$APK_PATH" || true

            PACKAGE="com.seedling.dev"
            ACTIVITY="com.seedling.dev.MainActivity"

            # ── Step 5: Launch app — warm up React Native JS bundle ───────────
            echo "Launching app to warm up React Native JS bundle..."
            adb shell am start -n "$PACKAGE/$ACTIVITY" || true
            echo "Waiting 30s for React Native bundle to fully render..."
            sleep 30

            # ── Step 6: Dismiss any ANR that appeared during app startup ──────
            echo "Dismissing any ANR dialogs after app launch..."
            adb shell input keyevent 4 || true
            sleep 1
            adb shell am broadcast -a android.intent.action.CLOSE_SYSTEM_DIALOGS || true
            sleep 2

            # ── Step 7: Capture pre-test diagnostic screenshot + XML dump ─────
            mkdir -p logs
            adb shell screencap -p /sdcard/pre_test_screen.png || true
            adb pull /sdcard/pre_test_screen.png logs/pre_test_screen.png || true
            adb shell uiautomator dump /sdcard/window_dump.xml || true
            adb pull /sdcard/window_dump.xml logs/window_dump.xml || true
            echo "=== PRE-TEST SCREEN XML ==="
            cat logs/window_dump.xml | head -100 || true

            # ── Step 8: Force-stop — let Appium do fresh launch ───────────────
            adb shell am force-stop "$PACKAGE" || true
            sleep 2

            # ── Step 9: Run Maven tests ───────────────────────────────────────
            ${{ env.TEST_COMMAND }}

      - name: Authenticate to Google Cloud for Firebase Test Lab
        if: ${{ github.event.inputs.platform == 'android' }}
        continue-on-error: true
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        if: ${{ github.event.inputs.platform == 'android' }}
        continue-on-error: true
        uses: google-github-actions/setup-gcloud@v2

      - name: Run Firebase Test Lab Real Device Test
        if: ${{ github.event.inputs.platform == 'android' }}
        continue-on-error: true
        run: |
          APK_PATH=$(find apps/qa apps -name "*.apk" 2>/dev/null | head -1)
          echo "Submitting APK ($APK_PATH) to Firebase Test Lab real physical devices..."
          gcloud firebase test android run \
            --type robo \
            --app "$APK_PATH" \
            --device model=redfin,version=30,locale=en,orientation=portrait \
            --device model=oriole,version=33,locale=en,orientation=portrait \
            --project "seedling-automation" \
            --timeout 15m



      - name: Run iOS Tests on Simulator
        if: ${{ github.event.inputs.platform == 'ios' }}
        env:
          QA_USERNAME: ${{ secrets.QA_USERNAME }}
          QA_PASSWORD: ${{ secrets.QA_PASSWORD }}
          PROD_USERNAME: ${{ secrets.PROD_USERNAME }}
          PROD_PASSWORD: ${{ secrets.PROD_PASSWORD }}
        run: ${{ env.TEST_COMMAND }}


      - name: Upload Test Report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: mobile-report-qa-${{ github.event.inputs.platform }}
          path: |
            target/index.html
            target/surefire-reports/
            logs/
            appium.log
          retention-days: 30

      - name: Deploy Report to Surge
        if: ${{ !cancelled() && env.SURGE_LOGIN != '' }}
        env:
          SURGE_LOGIN: ${{ secrets.SURGE_LOGIN }}
          SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}
        run: |
          if [ -f target/index.html ]; then
            npx surge ./target ${{ github.run_id }}-seedling-mobile-qa.surge.sh
          fi

      - name: Prepare HTML Email Body
        if: ${{ !cancelled() }}
        env:
          ENVIRONMENT: QA
          PLATFORM: ${{ github.event.inputs.platform }}
          COMPONENT: ${{ github.event.inputs.component }}
          REPORT_URL: "https://${{ github.run_id }}-seedling-mobile-qa.surge.sh"
          RUN_URL: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          JOB_STATUS: ${{ job.status }}
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          node utils/generate-email-html.js

      - name: Send Email Report
        if: ${{ !cancelled() && env.EMAIL_USERNAME != '' }}
        uses: dawidd6/action-send-mail@v3
        env:
          EMAIL_USERNAME: ${{ secrets.EMAIL_USERNAME }}
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "Mobile QA [${{ github.event.inputs.platform }}] - ${{ job.status == 'success' && '✅ PASSED' || '❌ FAILED' }}"
          to: ${{ secrets.TL_EMAIL }}
          from: Seedling Automation <${{ secrets.EMAIL_USERNAME }}>
          html_body: file://email-body.html
