name: Native Mobile Tests

on:
  workflow_dispatch:
    inputs:
      env:
        description: 'Target Environment'
        type: choice
        required: true
        options:
          - qa
          - prod
        default: 'qa'
      platform:
        description: 'Mobile Platform'
        type: choice
        required: true
        options:
          - android
          - ios
        default: 'android'
      target:
        description: 'Execution Target (Device Type)'
        type: choice
        required: true
        options:
          - github_virtual_device (100% Free - Emulator/Simulator)
          - browserstack (Real Cloud Device Farm)
        default: 'github_virtual_device (100% Free - Emulator/Simulator)'
      component:
        description: 'Test File / Flow to Run'
        type: choice
        required: true
        options:
          - all (Run full suite)
          - com.company.automation.tests.LoginTests
          - com.company.automation.tests.SeedlingCreationTests
        default: 'all (Run full suite)'

jobs:
  test:
    timeout-minutes: 60
    runs-on: macos-14
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # ----------------------------------------------------
      # Appium & Virtual Device Setup (for Free GitHub Runner)
      # ----------------------------------------------------
      - name: Install Appium
        if: ${{ startsWith(github.event.inputs.target, 'github_virtual_device') }}
        run: |
          npm install -g appium
          appium -v

      - name: Setup Android Driver & APK
        if: ${{ startsWith(github.event.inputs.target, 'github_virtual_device') && github.event.inputs.platform == 'android' }}
        run: |
          appium driver install uiautomator2
          mkdir -p apps/${{ github.event.inputs.env }}
          if ! ls apps/${{ github.event.inputs.env }}/*.apk apps/*.apk 1> /dev/null 2>&1; then
            echo "Downloading APK from Google Drive..."
            python3 -m pip install --quiet gdown
            gdown 1dDV9FrZieZXvqcirdp5Brm_pPrYzu1Mf -O apps/${{ github.event.inputs.env }}/seedling.apk
          else
            echo "Found existing APK file in apps folder."
          fi

      - name: Setup iOS Driver & Simulator
        if: ${{ startsWith(github.event.inputs.target, 'github_virtual_device') && github.event.inputs.platform == 'ios' }}
        run: |
          appium driver install xcuitest

          # Unpack iOS App if zipped
          for zipfile in apps/${{ github.event.inputs.env }}/*.zip apps/*.zip; do
            if [ -f "$zipfile" ]; then
              echo "Unpacking $zipfile into apps/${{ github.event.inputs.env }}/..."
              mkdir -p apps/${{ github.event.inputs.env }}
              unzip -o "$zipfile" -d apps/${{ github.event.inputs.env }}/
            fi
          done

          # Boot iPhone 15 Simulator
          UDID=$(xcrun simctl list devices available | grep "iPhone 15" | head -1 | grep -oE "\([0-9A-F-]+\)" | tr -d "()")
          if [ -z "$UDID" ]; then
            UDID=$(xcrun simctl list devices available | grep "iPhone" | head -1 | grep -oE "\([0-9A-F-]+\)" | tr -d "()")
          fi
          echo "Booting iOS Simulator UDID: $UDID"
          xcrun simctl boot $UDID || true
          xcrun simctl bootstatus $UDID -b

      - name: Start Appium Server in Background
        if: ${{ startsWith(github.event.inputs.target, 'github_virtual_device') }}
        run: |
          nohup appium --log appium.log --port 4723 > /dev/null 2>&1 &
          sleep 5
          curl --retry 5 --retry-delay 2 --retry-connrefused http://127.0.0.1:4723/status || echo "Appium warming up..."

      # ----------------------------------------------------
      # Determine Test Command
      # ----------------------------------------------------
      - name: Determine Test Command
        id: set-command
        run: |
          ENV="${{ github.event.inputs.env }}"
          PLATFORM="${{ github.event.inputs.platform }}"
          TARGET="${{ github.event.inputs.target }}"
          COMP="${{ github.event.inputs.component }}"

          EXEC_MODE="ci"
          if [[ "$TARGET" =~ "browserstack" ]]; then
            EXEC_MODE="browserstack"
          fi

          if [[ "$COMP" == *"all"* ]]; then
            SUITE_FILE="testng-${ENV}.xml"
            CMD="mvn test -Denv=${ENV} -Dplatform=${PLATFORM} -Dexecution=${EXEC_MODE} -DsuiteXmlFile=${SUITE_FILE}"
          else
            CMD="mvn test -Denv=${ENV} -Dplatform=${PLATFORM} -Dexecution=${EXEC_MODE} -Dtest=${COMP} -DsuiteXmlFile="
          fi

          echo "TEST_COMMAND=$CMD" >> $GITHUB_ENV
          echo "Selected Test Command: $CMD"

      # ----------------------------------------------------
      # Execute Tests
      # ----------------------------------------------------
      - name: Run Android Tests on Emulator
        if: ${{ startsWith(github.event.inputs.target, 'github_virtual_device') && github.event.inputs.platform == 'android' }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: arm64-v8a
          profile: pixel_7
          disable-animations: true
          script: |
            ${{ env.TEST_COMMAND }} 2>&1 | tee test-output.log
            exit ${PIPESTATUS[0]}

      - name: Run iOS Tests on Simulator
        if: ${{ startsWith(github.event.inputs.target, 'github_virtual_device') && github.event.inputs.platform == 'ios' }}
        run: |
          ${{ env.TEST_COMMAND }} 2>&1 | tee test-output.log
          exit ${PIPESTATUS[0]}

      - name: Run Tests on BrowserStack Cloud
        if: ${{ contains(github.event.inputs.target, 'browserstack') }}
        env:
          BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
        run: |
          ${{ env.TEST_COMMAND }} 2>&1 | tee test-output.log
          exit ${PIPESTATUS[0]}

      # ----------------------------------------------------
      # Reporting & Email Alerts
      # ----------------------------------------------------
      - name: Upload ExtentReports Artifact
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: mobile-report-${{ github.event.inputs.env }}-${{ github.event.inputs.platform }}
          path: |
            target/index.html
            target/surefire-reports/
            logs/
            appium.log
          retention-days: 30

      - name: Deploy Report to Surge
        if: ${{ !cancelled() && env.SURGE_LOGIN != '' }}
        env:
          SURGE_LOGIN: ${{ secrets.SURGE_LOGIN }}
          SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}
        run: |
          if [ -f target/index.html ]; then
            npx surge ./target ${{ github.run_id }}-seedling-mobile-${{ github.event.inputs.env }}.surge.sh
          fi

      - name: Prepare Email Body
        if: ${{ !cancelled() }}
        run: |
          REPORT_URL="https://${{ github.run_id }}-seedling-mobile-${{ github.event.inputs.env }}.surge.sh"

          echo "Mobile Automation Test Run Complete." > email-body.txt
          echo "Status: ${{ job.status }}" >> email-body.txt
          echo "Environment: ${{ github.event.inputs.env | uppercase }}" >> email-body.txt
          echo "Platform: ${{ github.event.inputs.platform | uppercase }}" >> email-body.txt
          echo "Component: ${{ github.event.inputs.component }}" >> email-body.txt
          echo "Branch: ${{ github.ref_name }}" >> email-body.txt
          echo "Run Link: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> email-body.txt
          echo "" >> email-body.txt

          if [ "${{ job.status }}" != "success" ]; then
            echo "=== FAILURE SUMMARY ===" >> email-body.txt
            if [ -f test-output.log ]; then
              grep -E "FAILURE|ERROR|Exception|AssertionError" test-output.log | head -20 >> email-body.txt || echo "See HTML ExtentReport for failure details and screenshot." >> email-body.txt
            fi
            echo "=======================" >> email-body.txt
            echo "" >> email-body.txt
          fi

          echo "VIEW INTERACTIVE HTML REPORT HERE (One-Click):" >> email-body.txt
          echo "$REPORT_URL" >> email-body.txt
          echo "" >> email-body.txt

      - name: Send Email Report
        if: ${{ !cancelled() && env.EMAIL_USERNAME != '' }}
        uses: dawidd6/action-send-mail@v3
        env:
          EMAIL_USERNAME: ${{ secrets.EMAIL_USERNAME }}
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "Mobile [${{ github.event.inputs.env | uppercase }} - ${{ github.event.inputs.platform | uppercase }}] Run ${{ job.status }} - ${{ github.event.inputs.component }}"
          to: ${{ secrets.TL_EMAIL }}
          from: Seedling Automation <${{ secrets.EMAIL_USERNAME }}>
          body: file://email-body.txt
