# PRODUCTION environment settings
base.url=https://api.yourapp.com
env.name=PROD

# App identifiers for the production build
android.appPackage=com.company.app
android.appActivity=com.company.app.MainActivity
ios.bundleId=com.seedling.prod

# Safety flag - BaseTest checks this and refuses to run any test not tagged
# "prod" as a TestNG group, regardless of what suite XML is passed in.
allow.write.operations=false
